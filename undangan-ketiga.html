<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Story - Amar & Mariam</title>

    <link rel="stylesheet" href="css/undangan-ketiga.css">
</head>
<body>

    <main class="cinematic">

        <!-- MAIN PHOTO -->
        <div class="photo-container">
            <img
                src="assets/images/amar-mariam.jpg"
                id="couplePhoto"
                alt="Amar dan Mariam"
            >
            <div class="photo-overlay"></div>
        </div>

<!-- WORD FLOW ANIMATION -->
<div id="lyricRain" class="lyric-rain"></div>

<div id="coupleNames" class="couple-names">
    <span class="name-amar">Amar</span>
    <span class="name-and">&</span>
    <span class="name-mariam">Mariam</span>
</div>



        <!-- MUSIC PANEL -->
        <div class="music-panel">

            <button id="playButton" aria-label="Putar musik">
                ▶
            </button>

            <div class="timeline-area">
                <div class="time-labels">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>

                <input
                    type="range"
                    id="musicTimeline"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                >
            </div>

            <div class="volume-area">
                <span>♪</span>
                <input
                    type="range"
                    id="volumeControl"
                    min="0"
                    max="1"
                    value="0.7"
                    step="0.01"
                >
            </div>

        </div>

        <audio id="weddingAudio" preload="metadata">
            <source
                src="assets/music/musik-ketiga.mp3"
                type="audio/mpeg"
            >
        </audio>

    </main>
<!-- MUSIC SWITCHER MENU -->
<div class="music-switcher">
    <button type="button"
            class="cd-switch"
            id="musicSwitcherToggle"
            aria-label="Ganti musik"
            aria-expanded="false"
            title="Ganti Musik">

        <svg class="cd-switch-text" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
                <path id="cdTextCircle2"
                      d="M 50,50 m -39,0 a 39,39 0 1,1 78,0 a 39,39 0 1,1 -78,0" />
            </defs>
            <text>
                <textPath href="#cdTextCircle2"
                          startOffset="50%"
                          text-anchor="middle">
                    GANTIMUSIK
                </textPath>
            </text>
        </svg>
    </button>

    <div class="music-switcher-menu">
        <a href="index.html" class="music-page-link page-one">1</a>
       <a href="undangan-kedua.html?buka=1" class="music-page-link page-two">2</a>
        <a href="undangan-ketiga.html" class="music-page-link page-three">3</a>
    </div>
</div>
    <script src="js/undangan-ketiga.js"></script>
<script src="js/music-switcher.js"></script>
</body>
</html>
